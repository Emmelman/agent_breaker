# Конфигурация Agent-Breaker v2

llm:
  # GigaChat (банковский IFT-контур), доступ по mTLS-сертификатам
  base_url: "https://gigachat-ift.sberdevices.delta.sbrf.ru/v1"
  # Пути к клиентским сертификатам (относительно этого config.yaml).
  # Сами файлы кладутся в v2/certs/ вручную и НЕ коммитятся в git.
  cert_path: "certs/client_cert.pem"
  key_path: "certs/client_key.pem"
  # Проверка серверного TLS-сертификата. false — отключить (защита на mTLS),
  # либо путь к корневому CA-bundle банка.
  verify_ssl: false
  timeout: 120
  max_retries: 3

  # Multi-model: разные роли (Ouroboros pattern). В банке все роли — GigaChat.
  models:
    attacker:
      model: "GigaChat-2-Max"
      temperature: 0.7
      max_tokens: 2048
    judge:
      model: "GigaChat-2-Max"
      temperature: 0.1
      max_tokens: 1024
    reviewer:
      model: "GigaChat-2-Max"
      temperature: 0.3
      max_tokens: 1024
    thinker:
      model: "GigaChat-2-Max"
      temperature: 0.3
      max_tokens: 512

  # Fallback-модель если роль не настроена
  fallback_model: "GigaChat-2-Max"

target:
  api_url: "http://localhost:8000/api/chat"
  timeout: 120

evolution:
  enabled: true
  max_cycles: 3

budget:
  max_tokens: 100000

attacks:
  per_risk: 10
  batch_delay: 1.0

hall:
  kb_path: "C:\\Users\\Nikita\\Documents\\Python Projects\\chatbot-professor_v2\\data\\knowledge_base"
  questions_per_type: 5
